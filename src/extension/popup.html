<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RFC Viewer</title>
    <style>
      body { font-family: system-ui, sans-serif; min-width: 240px; margin: 0; padding: 0.75rem; }
      button { width: 100%; margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <button id="copyMarkdown">Copy Markdown</button>
    <button id="copyHtml">Copy HTML</button>
    <button id="collapseAll">Collapse all sections</button>
    <button id="expandAll">Expand all sections</button>
    <button id="resetPage">Reset this page</button>
    <button id="resetAll">Reset all pages</button>
    <script src="popup.js"></script>
  </body>
</html>
